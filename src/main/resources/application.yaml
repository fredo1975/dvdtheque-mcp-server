debug: true
spring:
  application:
    name: dvdtheque-mcp-server
  main:
    web-application-type: none

ai:
  ollama:
    base-url: http://localhost:11434
    chat:
      options:
        model: llama3.2
        temperature: 0.7
        num-predict: 2000
      enabled: true

dvdtheque:
  api:
    base-url: http://localhost:8762/dvdtheque-service
    endpoints:
      get-by-titre: /dvds/{id}

logging:
  level:
    org:
      springframework:
        ai: DEBUG
    reactor:
      netty:
        http:
          client: DEBUG

server.port: 8060